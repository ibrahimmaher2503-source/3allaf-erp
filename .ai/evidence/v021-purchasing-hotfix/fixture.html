<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#18181b;font-family:Arial,sans-serif}.shell{max-width:1280px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.invoice{display:grid;grid-template-columns:minmax(176px,1.25fr) minmax(160px,1fr) minmax(144px,.8fr) minmax(208px,1.35fr);gap:20px}.meta{display:grid;gap:9px}.muted{color:#71717a;font-size:12px}.actions{border-inline-start:1px solid #ddd;padding-inline-start:18px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.button{border:1px solid #bbb;border-radius:9px;padding:9px 13px;background:white;font-weight:600}.primary{background:#18181b;color:#fff}.badge{display:inline-block;border-radius:99px;background:#fef3c7;padding:4px 9px;font-size:12px}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:8px}.field{min-width:0}.input{height:42px;border:1px solid #aaa;border-radius:9px;background:white;margin-top:5px}.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,auto);gap:12px;align-items:center}.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:#666}.line{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}.ltr{direction:ltr;unicode-bidi:isolate}.ui-copy{unicode-bidi:plaintext}@media(max-width:700px){.shell{padding:14px}.head{align-items:flex-start;flex-direction:column}.invoice{grid-template-columns:1fr}.actions{border-inline-start:0;border-top:1px solid #ddd;padding-inline-start:0;padding-top:14px}.controls{grid-template-columns:1fr}.button{width:100%}.result{grid-template-columns:1fr}.codes{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line>:first-child{grid-column:1/-1}}
</style></head><body><main class="shell" id="app"></main><script>
const q=new URLSearchParams(location.search), ar=q.get('locale')==='ar', screen=q.get('screen')||'list';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
const t=(a,e)=>`<span class="ui-copy">${ar?a:e}</span>`, code=v=>`<span class="ltr">${v}</span>`;
const list=()=>`${header()}<section><article class="card invoice"><div><div>${code('TEST-PIN-0001-000010')} <span class="badge">${t('بانتظار التوزيع','Awaiting Distribution')}</span></div><div class="muted">${code('TEST-AWAIT-2')}</div><p>${t('اختبار — مورد','TEST-Supplier')}</p></div><div class="meta"><div><span class="muted">${t('المخزن','Store')}</span><br>${t('اختبار — مخزن الاستلام','TEST-Receiving Warehouse')}</div><div><span class="muted">${t('التاريخ','Date')}</span><br>${code('2026-08-31')}</div><div><span class="muted">${t('الإجمالي','Total')}</span><br>${code('20.00')} ${t('ج.م','EGP')}</div></div><div class="meta"><div><span class="muted">${t('المرحلة الحالية','Current stage')}</span><br>${t('المرحلة 2','Stage 2')}</div><div><span class="muted">${t('الكمية المتبقية','Remaining quantity')}</span><br>${code('2')}</div></div><div class="actions"><span class="muted">${t('الإجراء التالي المطلوب','Next required action')}</span><h3>${t('مراجعة الكميات وتوزيعها','Review and distribute quantities')}</h3><div class="buttons"><button class="button primary">${t('مراجعة الكميات وتوزيعها','Review and distribute quantities')}</button><button class="button">${t('طباعة','Print')}</button></div></div></article><article class="card invoice"><div>${code('TEST-PIN-0001-000011')} <span class="badge">${t('معتمدة','Approved')}</span><p>${t('اختبار — مورد','TEST-Supplier')}</p></div><div class="meta"><div>${t('اختبار — منفذ البيع','TEST-Sales Outlet')}</div><div>${code('2026-08-31')}</div><div>${code('20.00')} ${t('ج.م','EGP')}</div></div><div class="meta"><div>${t('المرحلة 2','Stage 2')}</div><div>${code('0')}</div></div><div class="actions"><span class="muted">${t('الإجراء التالي المطلوب','Next required action')}</span><h3>${t('لا يوجد إجراء آخر','No further action')}</h3><button class="button">${t('طباعة الملصقات','Print labels')}</button></div></article></section>`;
const create=()=>`${header()}<article class="card"><h2>${t('المرحلة 1 — فاتورة المشتريات','Stage 1 — Purchase invoice')}</h2><p>${t('امسح باركود الأصناف أو ابحث عنها، ثم احفظ الفاتورة بأمان كمسودة.','Scan or search products, then save the invoice safely as a draft.')}</p><div class="controls"><label class="field">${t('الباركود أو كود الصنف','Barcode or item code')}<div class="input"></div></label><button class="button primary">${t('إضافة','Add')}</button><button class="button">${t('المسح بالكاميرا','Scan with camera')}</button></div><div class="card"><strong>${t('البحث عن الأصناف','Search products')}</strong><p class="muted">${t('أدخل 3 أحرف أو أرقام على الأقل. يشمل البحث الاسم والموديل وكود الصنف والباركود.','Enter at least 3 characters or digits. Search covers name, model, item code, and barcode.')}</p><div class="result"><b>${t('اختبار — منتج ذهبي','TEST-Golden Product')}</b><div class="codes ltr"><span>TEST-MODEL-0001</span><span>TEST-ITEM-0001</span><span>6220001000001</span></div></div></div><div class="line"><div><span class="muted">${t('الصنف','Product')}</span><br>${t('اختبار — منتج ذهبي','TEST-Golden Product')}<br>${code('TEST-ITEM-0001')}</div><div>${t('الكمية','Quantity')}<br>${code('2')}</div><div>${t('تكلفة الوحدة','Unit cost')}<br>${code('10')}</div><div>${t('الخصم','Discount')}<br>${code('0')}</div><div>${t('الضريبة %','Tax %')}<br>${code('0')}</div></div></article>`;
function header(){return `<header class="head"><div><h1>${t('فواتير المشتريات','Purchase invoices')}</h1><p>${t('راجع فواتير الموردين والاستلام والاعتمادات والترحيل ضمن نطاق صلاحياتك.','Review supplier invoices, receiving, approvals, and posting within your scope.')}</p></div><button class="button primary">${t('فاتورة مسودة جديدة','New draft invoice')}</button></header>`}document.getElementById('app').innerHTML=screen==='create'?create():list();
</script></body></html>
