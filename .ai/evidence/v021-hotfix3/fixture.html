<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb;color:#17202a}main{max-width:1120px;margin:auto;padding:20px}.head,.card{background:white;border:1px solid #d8dee8;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.item{border:1px solid #edc36b;background:#fffaf0;border-radius:10px;padding:12px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px}.badge{background:#fff0c2;color:#754c00;border-radius:20px;padding:5px 10px}.button{display:inline-block;background:#155eef;color:white;border-radius:8px;padding:8px 12px;text-decoration:none}.muted{color:#667085;font-size:13px}.code{direction:ltr;unicode-bidi:isolate}@media(max-width:600px){main{padding:10px}.stats{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.button{width:100%;text-align:center}}</style></head><body><main id="app"></main><script>const q=new URLSearchParams(location.search),ar=q.get('locale')==='ar',view=q.get('view')||'setup';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';const t=(a,e)=>ar?a:e;const details=`<section class="card"><div class="row"><strong>${t('كروت الأصناف المتأثرة: 2','Affected Product Cards: 2')}</strong><a>${t('عرض كل الأصناف المتأثرة','View all affected products')}</a></div><div class="item"><span><b>${t('اختبار — منتج دولي','TEST-International Product')}</b><br><span class="muted"><span class="code">TEST-ITEM-INT-0001</span> · ${t('سعر المستهلك الأساسي الحالي: غير محدد','Current base consumer price: Not set')}</span></span><a class="button">${t('تعديل كارت الصنف','Edit Product Card')}</a></div><div class="item"><span><b>${t('اختبار — منتج محلي','TEST-Local Product')}</b><br><span class="muted"><span class="code">TEST-ITEM-LOC-0001</span> · ${t('سعر المستهلك الأساسي الحالي: 0','Current base consumer price: 0')}</span></span><a class="button">${t('تعديل كارت الصنف','Edit Product Card')}</a></div></section>`;const counts=`<section class="card"><div class="stats"><div class="stat">${t('الأسعار الموروثة','Inherited prices')}<br><b>18</b></div><div class="stat">${t('الأسعار الفعلية','Effective prices')}<br><b>18</b></div><div class="stat">${t('التجاوزات اليدوية','Manual overrides')}<br><b>0</b></div></div><p class="muted">${t('ترث القائمة 0 سعر المستهلك الأساسي من كارت الصنف افتراضيًا. التجاوزات اليدوية استثناءات صريحة فقط، ولا يعني العدد صفر أن القائمة 0 بلا أسعار فعلية.','List 0 inherits the Product Card base consumer price by default. Manual overrides are explicit exceptions only. A zero count does not mean List 0 has no effective prices.')}</p></section>`;let title=view==='setup'?t('مركز الإعداد','Setup Center'):view==='products'?t('المنتجات والباركود','Products & barcodes'):view==='pricing'?t('قوائم الأسعار','Pricing Lists'):t('تفاصيل الأصناف المتأثرة','Affected product details');document.getElementById('app').innerHTML=`<header class="head row"><div><h1>${title}</h1><p class="muted">${t('تُحتسب الجاهزية من البيانات الحالية في كل طلب.','Readiness is calculated from current data on every request.')}</p></div><span class="badge">${t('يتطلب استكمال','Requires completion')}</span></header>${view==='pricing'?counts:''}${details}`;</script></body></html>
