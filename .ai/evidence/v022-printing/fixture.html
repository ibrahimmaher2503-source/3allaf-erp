<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#18181b;font-family:Arial,sans-serif}main{max-width:1120px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d4d4d8;border-radius:14px;padding:18px;margin:12px 0}.grid,.templates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-size:13px}input,select,.button{min-height:44px;border:1px solid #a1a1aa;border-radius:8px;padding:10px 12px;background:#fff}.button{display:inline-flex;align-items:center;justify-content:center;background:#0f766e;color:#fff;text-decoration:none}.actions{display:flex;gap:8px;justify-content:flex-end}.muted{color:#52525b}.badge{border-radius:999px;background:#dcfce7;color:#166534;padding:4px 9px}.row{display:flex;justify-content:space-between;align-items:start;gap:12px}.scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:600px){main{padding:12px}.grid,.templates,.scope{grid-template-columns:1fr}.actions{position:sticky;bottom:0;background:#fff;padding:8px 0}.row{flex-wrap:wrap}}</style></head><body><main id="app"></main><script>const q=new URLSearchParams(location.search),ar=q.get('locale')==='ar',view=q.get('view')||'library';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';const t=(a,e)=>ar?a:e;const library=`<h1>${t('مكتبة قوالب الطباعة','Printing Template Library')}</h1><p class="muted">${t('أنشئ تخطيطات مستندات قابلة لإعادة الاستخدام حسب نوع المستند ومقاس الورق واللغة، ثم اربط القوالب المتوافقة بالطابعات.','Create reusable document layouts by document type, paper size, and language, then assign compatible templates to printers.')}</p><section class="card"><div class="grid"><label>${t('الاسم بالعربية','Arabic name')}<input value="فاتورة حرارية"></label><label>${t('الاسم بالإنجليزية','English name')}<input value="Thermal invoice" dir="ltr"></label><label>${t('نوع المستند','Document type')}<select><option>${t('فاتورة مبيعات','Sales invoice')}</option></select></label><label>${t('مقاس الورق','Paper size')}<select><option>80 mm</option><option>A5</option><option>50 × 30 mm</option></select></label><label>${t('اللغة','Language')}<select><option>${t('العربية والإنجليزية','Arabic and English')}</option></select></label><label>${t('الحالة','Status')}<select><option>${t('نشط','Active')}</option></select></label></div><div class="actions"><a class="button">${t('حفظ','Save')}</a></div></section><section class="templates"><article class="card"><div class="row"><b>${t('فاتورة مبيعات حرارية','Thermal sales invoice')}</b><span class="badge">${t('نشط','Active')}</span></div><p>80 mm · ${t('ثنائي اللغة','Bilingual')}</p><a class="button">${t('معاينة','Preview')}</a></article><article class="card"><div class="row"><b>${t('ملصق باركود','Barcode label')}</b><span class="badge">${t('نشط','Active')}</span></div><p>50 × 30 mm</p><a class="button">${t('اختبار الطباعة','Test print')}</a></article></section>`;const printer=`<h1>${t('الطابعات وإعدادات الطباعة','Printers and print settings')}</h1><p class="muted">${t('حدد نطاق الطابعة ثم اختر موقعًا وقالبًا متوافقًا.','Choose the printer scope, then select a compatible location and template.')}</p><section class="card"><div class="scope"><label>${t('موقع الطابعة','Printer location')}<select><option>${t('فرع','Branch')}</option></select></label><label>${t('الفرع','Branch')}<select><option>${t('فرع القاهرة','Cairo branch')}</option></select></label><label>${t('المتجر / نقطة البيع','Store / point of sale')}<select><option>${t('منفذ مدينة نصر','Nasr City outlet')}</option></select></label><label>${t('نوع الطابعة','Printer type')}<select><option>${t('طابعة إيصالات حرارية','Thermal receipt printer')}</option></select></label><label>${t('مقاس الورق','Paper size')}<select><option>80 mm</option><option>58 mm</option></select></label><label>${t('قالب الطباعة','Print template')}<select><option>${t('فاتورة مبيعات حرارية','Thermal sales invoice')}</option></select></label></div><div class="actions"><a class="button">${t('حفظ','Save')}</a></div></section>`;document.getElementById('app').innerHTML=view==='library'?library:printer;</script></body></html>
