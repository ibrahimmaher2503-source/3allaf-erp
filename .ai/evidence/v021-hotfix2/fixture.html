<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#18181b;font-family:Arial,sans-serif}.shell{max-width:1120px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}.input{height:42px;border:1px solid #aaa;border-radius:8px;margin-top:5px}.button{border:1px solid #aaa;border-radius:8px;padding:10px 14px;background:#fff;font-weight:700}.primary{background:#18181b;color:#fff}.help{color:#71717a;font-size:13px}.result{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px;border-top:1px solid #ddd}.codes{direction:ltr;unicode-bidi:isolate;color:#666}.ui{unicode-bidi:plaintext}.ltr{direction:ltr;unicode-bidi:isolate}@media(max-width:700px){.shell{padding:14px}.grid,.controls{grid-template-columns:1fr}.button{width:100%}.result{grid-template-columns:1fr}}</style></head><body><main id="app" class="shell"></main><script>const q=new URLSearchParams(location.search),ar=q.get('locale')==='ar',mode=q.get('mode')||'purchase';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';const t=(a,e)=>`<span class="ui">${ar?a:e}</span>`,field=(a,e,v='')=>`<label>${t(a,e)}<div class="input ltr">${v}</div></label>`;
function purchase(){return `<h1>${t('المرحلة 1 — فاتورة المشتريات','Stage 1 — Purchase invoice')}</h1><p>${t('امسح باركود الأصناف أو ابحث عنها، ثم احفظ الفاتورة بأمان كمسودة.','Scan or search products, then save the invoice safely as a draft.')}</p><section class="card"><div class="controls">${field('الباركود أو كود الصنف','Barcode or item code')}<button class="button primary">${t('إضافة','Add')}</button><button class="button">${t('المسح بالكاميرا','Scan with camera')}</button></div><div class="card"><b>${t('البحث عن الأصناف','Search products')}</b><p class="help">${t('أدخل 3 أحرف أو أرقام على الأقل. يشمل البحث الاسم والموديل وكود الصنف والباركود.','Enter at least 3 characters or digits. Search covers name, model, item code, and barcode.')}</p><div class="result"><strong>${t('اختبار — منتج دولي','TEST-International Product')}</strong><span class="codes">TEST-MODEL-INT-0001 · TEST-ITEM-INT-0001 · 6220000000013</span></div><div class="result"><strong>${t('اختبار — منتج محلي','TEST-Local Product')}</strong><span class="codes">TEST-MODEL-LOC-0001 · TEST-ITEM-LOC-0001 · 01234000001</span></div></div></section>`}
function product(edit){return `<h1>${edit?t('تعديل كارت الصنف','Edit product card'):t('إضافة كارت صنف','Add Product Card')}</h1><section class="card"><h2>${t('البيانات الأساسية المطلوبة','Stage A — Required basic data')}</h2><div class="grid">${field('كود كارت الصنف','Product Card code','TEST-ITEM-INT-0001')}${field('رقم الموديل','Model number','TEST-MODEL-INT-0001')}${field('نوع المنتج','Product type',edit?t('منتج رقمي (سجل سابق)','Digital product (legacy)'):t('قياسي','Standard'))}${field('اسم الصنف بالعربية','Arabic product name',ar?'اختبار — منتج دولي':'')}${field('اسم الصنف بالإنجليزية','English product name',ar?'':'TEST-International Product')}${field('الباركود الدولي','International barcode','6220000000013')}</div><div style="margin-top:16px"><button class="button primary">${edit?t('حفظ كارت الصنف','Save product card'):t('إنشاء كارت الصنف','Create product card')}</button></div></section>`}document.getElementById('app').innerHTML=mode==='purchase'?purchase():product(mode==='product-edit');</script></body></html>
